[package]
name = "ytaskbary"
version = "0.1.0"
edition = "2021"
description = "Keeps the Windows 11 taskbar hidden and shows it only while the Start menu is open"
license = "MIT"
repository = "https://github.com/ycookiey/ytaskbary"
publish = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
